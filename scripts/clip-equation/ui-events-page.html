<!doctype html>
<!--
  Clip viewer D5 proof page (docs/clip-recorder-plan.md, "D5 as an equation", item 7).
  Plays a fixed schedule of ordinary UI events, by time from the schedule start:
    ?start=<unix ms>  the schedule start (wall clock); without it, 3 s after the page loads.
  The schedule is printed on the page (static text) and exposed as window.schedule:
  [{ id, t_ms, region, name, expect, until_ms?, many? }], expect = the timeline kind the viewer must
  report; region = the element holding the change; many = the row may give several events (typing).
  window.always lists what runs from page load (the spinners), each with its rect at load.
  The actual timing is exposed as window.actualTiming, one entry per schedule row, in ms from the
  schedule start: set_ms = the animation frame that made the change, shown_ms = the next animation
  frame (the change is on screen by then), rect = the region's box in CSS px of the viewport when
  the change was made; for a flash also hide_ms and hidden_ms. A flash stays
  on screen FLASH_MS from its shown_ms, so a late frame never shortens or hides it (issue #293).
  window.scheduleBoxFits is true when the printed schedule is shown whole, inside every viewport
  edge, and no card covers it; it is measured again on every resize.
  Boundary clips: record the page so that the clip ends 150 ms and, in a second run, exactly
  200 ms (SETTLE_MS) after the "last change" row is shown; d5.feature checks both outcomes.
  Always running, from page load to past the clip end:
    - a lone spinner (an ordinary 32 px border-arc spinner, 1 turn per second), far from all else;
    - spinner B beside a label, until a checkmark replaces it.
  Nothing flashes the whole window: every change is local and small.
  Open the file directly in a browser; it needs no server and takes no input.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip D5 events page</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #f4f4f8; color: #222; font: 16px/1.5 "Segoe UI", Arial, sans-serif; }
  .card { position: absolute; background: #ffffff; border: 1px solid #c8c8d0; border-radius: 6px; }
  #schedule { position: absolute; left: 16px; top: 16px; width: 430px; background: #fffbe6;
              border: 1px solid #d8cf9c; border-radius: 6px; padding: 8px 12px; box-sizing: border-box;
              font: 12px/1.3 Consolas, monospace; white-space: pre; }
  #list { left: 480px; top: 16px; width: 260px; height: 160px; padding: 6px 0; box-sizing: border-box; }
  #list div { height: 28px; line-height: 28px; padding: 0 14px; }
  #list div.selected { background: #cce8ff; }
  #fillcard { left: 780px; top: 16px; width: 200px; height: 160px; }
  #fill { position: absolute; left: 30px; top: 30px; width: 140px; height: 100px; background: #ffffff; }
  #fill.on { background: #d0d0d0; }
  #dialog { position: absolute; left: 480px; top: 220px; width: 300px; height: 130px; background: #ffffff;
            border: 2px solid #555; border-radius: 8px; padding: 10px 16px; box-sizing: border-box;
            opacity: 0; transition: opacity 300ms linear; }
  #dialog.on { opacity: 1; }
  #dialog b { display: block; font-size: 18px; }
  #dialog span { display: inline-block; margin: 14px 12px 0 0; padding: 2px 14px; border: 1px solid #333; border-radius: 4px; }
  #savecard { left: 820px; top: 220px; width: 330px; height: 72px; }
  .spinner { position: absolute; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%;
             border: 4px solid #e2e2e2; border-top-color: #2f6fd0; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #spinnerB { left: 20px; top: 20px; }
  #check { position: absolute; left: 18px; top: 14px; font: bold 30px/1 "Segoe UI Symbol", Arial, sans-serif; color: #1b8a2e; display: none; }
  #saveLabel { position: absolute; left: 76px; top: 22px; }
  #flashcard { left: 480px; top: 400px; width: 420px; height: 110px; }
  #flash { position: absolute; left: 24px; top: 24px; width: 80px; height: 60px; background: #ff2050; display: none; }
  #status { position: absolute; left: 140px; top: 40px; }
  #altcard { left: 960px; top: 400px; width: 120px; height: 110px; }
  #alt { position: absolute; left: 30px; top: 25px; width: 60px; height: 60px; background: rgb(128, 128, 128); }
  #altflash { position: absolute; left: 0; top: 0; width: 60px; height: 60px; background: #202020; display: none; }
  #endcard { left: 960px; top: 540px; width: 100px; height: 60px; }
  #endlabel { position: absolute; left: 12px; top: 16px; }
  #trackcard { left: 16px; top: 560px; width: 860px; height: 72px; }
  #track { position: absolute; left: 30px; top: 16px; width: 800px; height: 40px; background: #e8e8e8; }
  #playhead { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: #c00000; }
  #typecard { left: 16px; top: 680px; width: 520px; height: 64px; }
  #field { position: absolute; left: 16px; top: 14px; width: 486px; height: 34px; border: 1px solid #888;
           box-sizing: border-box; padding: 4px 8px; font: 16px/24px Consolas, monospace; white-space: pre; }
  #caret { display: inline-block; width: 2px; height: 18px; background: #000; vertical-align: -3px; visibility: hidden; }
  #lonecard { left: 1080px; top: 640px; width: 100px; height: 100px; }
  #spinnerA { left: 34px; top: 34px; }
</style>
</head>
<body>
<div id="schedule"></div>
<div class="card" id="list"><div>Inbox</div><div>Drafts</div><div id="item3">Sent items</div><div>Archive</div><div>Trash</div></div>
<div class="card" id="fillcard"><div id="fill"></div></div>
<div id="dialog"><b>Delete this file?</b>It cannot be restored.<br><span>Cancel</span><span>Delete</span></div>
<div class="card" id="savecard"><div class="spinner" id="spinnerB"></div><div id="check">&#x2714;</div><div id="saveLabel">Saving 1 of 3 files</div></div>
<div class="card" id="flashcard"><div id="flash"></div><div id="status">Status: idle</div></div>
<div class="card" id="altcard"><div id="alt"><div id="altflash"></div></div></div>
<div class="card" id="endcard"><div id="endlabel">Done: no</div></div>
<div class="card" id="trackcard"><div id="track"><div id="playhead"></div></div></div>
<div class="card" id="typecard"><div id="field"><span id="typed"></span><span id="caret"></span></div></div>
<div class="card" id="lonecard"><div class="spinner" id="spinnerA"></div></div>
<script>
  const FLASH_MS = 50;              // d_min: one recorded instant
  const PLAYHEAD_PX_PER_S = 20;     // one pixel per recorded instant at 20 fps
  const TYPE_TEXT = 'clip viewer equation';
  const TYPE_MS_PER_CHAR = 120;
  const CARET_HALF_PERIOD_MS = 530; // the Windows default caret blink
  const AUTO_START_MS = 3000;
  // The grey square: its anchor is grey 128; it alternates 100/156, each SAME as the anchor
  // (28 <= delta_lo 32, with room for encoder noise) and DIFF frame to frame (56 on every pixel).
  const ALT_GREY = 128;
  const ALT_LOW = 100;
  const ALT_HIGH = 156;
  const ALT_STEP_MS = 50;           // a new value every recorded instant

  // t_ms from the schedule start; expect = the timeline kind the viewer must report.
  // region = the element whose box holds the change (its rect is measured when the change is made).
  const schedule = [
    { id: 'select', t_ms: 2000, region: 'item3', name: 'list selection #cce8ff on white', expect: 'change' },
    { id: 'fill', t_ms: 4000, region: 'fill', name: 'grey fill #d0d0d0 on white', expect: 'change' },
    { id: 'fade', t_ms: 6000, region: 'dialog', name: 'dialog fades in over 300 ms', expect: 'change' },
    { id: 'label', t_ms: 8000, region: 'saveLabel', name: 'label changes beside running spinner B', expect: 'change' },
    { id: 'check', t_ms: 10000, region: 'check', name: 'checkmark replaces spinner B', expect: 'change' },
    { id: 'flash', t_ms: 12000, region: 'flash', name: '50 ms flash', expect: 'short_lived' },
    { id: 'status', t_ms: 12000, region: 'status', name: 'status label changes beside the flash', expect: 'change' },
    { id: 'playhead', t_ms: 14000, region: 'track', name: 'playhead (2 px) starts moving, 20 px/s', expect: 'animating' },
    { id: 'alternate', t_ms: 15000, until_ms: 16000, region: 'alt', name: 'grey square alternates 100/156 around 128', expect: 'animating' },
    { id: 'typing', t_ms: 16000, until_ms: 18400, region: 'field', many: true, name: 'typing starts, 20 characters, 120 ms each', expect: 'change' },
    { id: 'darkflash', t_ms: 16400, region: 'alt', name: '50 ms dark flash in the grey square', expect: 'short_lived' },
    { id: 'still', t_ms: 19000, until_ms: 29000, region: null, name: 'still period: nothing new (caret blinks)', expect: 'none' },
    { id: 'boundary', t_ms: 30000, region: 'endlabel', name: 'last change; boundary clips end 150/200 ms on', expect: 'change' },
  ];
  window.schedule = schedule;
  // Running from page load, measured at load: the viewer must report each as one animation.
  const always = [
    { id: 'lone', region: 'spinnerA', name: 'lone spinner', expect: 'animating' },
    { id: 'spinnerB', region: 'spinnerB', until_ms: 10000, name: 'spinner B until the checkmark', expect: 'animating' },
  ];
  window.always = always;

  const param = Number(new URLSearchParams(location.search).get('start'));
  const start = Number.isFinite(param) && param > 0 ? param : Date.now() + AUTO_START_MS;
  window.scheduleStart = start;

  const $ = id => document.getElementById(id);
  $('schedule').textContent =
    'Clip D5 proof page: schedule (ms from start)\n' +
    'start (unix ms): ' + start + '\n\n' +
    schedule.map(e => (('      ' + e.t_ms).slice(-6)) + (e.until_ms ? '-' + e.until_ms : '') +
      '  ' + e.name + '\n        expect: ' + e.expect).join('\n') +
    '\n\nalways: lone spinner (bottom right),\n        spinner B until 10000';

  // The rect of an element in CSS px of the viewport, or null when it has no box.
  function rectOf(id) {
    if (!id) return null;
    const r = $(id).getBoundingClientRect();
    return r.width > 0 && r.height > 0 ? { x: r.left, y: r.top, w: r.width, h: r.height } : null;
  }
  const overlaps = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;

  // The printed schedule is shown whole: nothing cut off, inside every viewport edge, and no
  // card covers it. Measured at load and again on every resize.
  function updateBoxFits() {
    const el = $('schedule');
    const box = el.getBoundingClientRect();
    const covered = [...document.querySelectorAll('.card, #dialog')].some(c => overlaps(box, c.getBoundingClientRect()));
    window.scheduleBoxFits = el.scrollHeight <= el.clientHeight && el.scrollWidth <= el.clientWidth
      && box.left >= 0 && box.top >= 0 && box.right <= window.innerWidth && box.bottom <= window.innerHeight
      && !covered;
  }
  updateBoxFits();
  window.addEventListener('resize', updateBoxFits);
  for (const row of always) row.rect = rectOf(row.region);
  window.pagePixelRatio = window.devicePixelRatio;

  let caretTimer = null;
  function blinkCaret() {
    clearInterval(caretTimer);
    $('caret').style.visibility = 'visible';
    caretTimer = setInterval(() => {
      const c = $('caret').style;
      c.visibility = c.visibility === 'hidden' ? 'visible' : 'hidden';
    }, CARET_HALF_PERIOD_MS);
  }

  function setGrey(value) {
    $('alt').style.background = 'rgb(' + value + ', ' + value + ', ' + value + ')';
  }

  // Per schedule row: once = the change made at its start; tick(t) = run every frame from its
  // start, t in ms since the start; flash = the element hidden FLASH_MS after it was shown.
  const steps = {
    select: { once: () => $('item3').classList.add('selected') },
    fill: { once: () => $('fill').classList.add('on') },
    fade: { once: () => $('dialog').classList.add('on') },
    label: { once: () => { $('saveLabel').textContent = 'Saving 2 of 3 files'; } },
    check: { once: () => { $('spinnerB').style.display = 'none'; $('check').style.display = 'block'; } },
    flash: { once: () => { $('flash').style.display = 'block'; }, flash: 'flash' },
    status: { once: () => { $('status').textContent = 'Status: synced'; } },
    playhead: { tick: t => { $('playhead').style.left = Math.min(798, Math.floor(t * PLAYHEAD_PX_PER_S / 1000)) + 'px'; } },
    alternate: { tick: (t, row) => {
      const running = t < row.until_ms - row.t_ms;
      setGrey(running ? (Math.floor(t / ALT_STEP_MS) % 2 ? ALT_HIGH : ALT_LOW) : ALT_GREY);
    } },
    typing: { tick: t => {
      const n = Math.min(TYPE_TEXT.length, Math.floor(t / TYPE_MS_PER_CHAR) + 1);
      if ($('typed').textContent.length !== n) {
        $('typed').textContent = TYPE_TEXT.slice(0, n);
        blinkCaret(); // solid while typing, blinks from the last key on
      }
    } },
    darkflash: { once: () => { $('altflash').style.display = 'block'; }, flash: 'altflash' },
    still: {},
    boundary: { once: () => { $('endlabel').textContent = 'Done: yes'; } },
  };

  // The actual timing (see the header): a change made in one animation frame is on screen by
  // the next one, whose time is written into the field waiting for it.
  const actualTiming = schedule.map(row => ({ name: row.name, t_ms: row.t_ms }));
  window.actualTiming = actualTiming;
  let awaitingPaint = [];
  function mark(entry, setField, shownField, t) {
    entry[setField] = t;
    awaitingPaint.push([entry, shownField]);
  }

  function frame(timestamp) {
    const t = performance.timeOrigin + timestamp - start;
    for (const [entry, field] of awaitingPaint) entry[field] = t;
    awaitingPaint = [];
    schedule.forEach((row, index) => {
      if (t < row.t_ms) return;
      const step = steps[row.id];
      const actual = actualTiming[index];
      if (actual.set_ms === undefined) {
        if (step.once) step.once();
        mark(actual, 'set_ms', 'shown_ms', t);
        actual.rect = rectOf(row.region);
      }
      if (step.tick) step.tick(t - row.t_ms, row);
      if (step.flash && actual.shown_ms !== undefined && actual.hide_ms === undefined && t - actual.shown_ms >= FLASH_MS) {
        $(step.flash).style.display = 'none';
        mark(actual, 'hide_ms', 'hidden_ms', t);
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
