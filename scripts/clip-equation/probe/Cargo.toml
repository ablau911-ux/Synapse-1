[package]
name = "clip-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Package 0 measurement probes for the clip recorder (docs/clip-recorder-plan.md, section 0)"

# An empty workspace table keeps this probe out of the main Synapse workspace.
[workspace]

[dependencies]
# Same versions as the Synapse workspace (Cargo.lock: windows-capture 2.0.0, windows 0.62.2).
windows-capture = "=2.0.0"
parking_lot = "0.12.5"
# Package 0b (plan section 0b, M11): the two compression finalists for the waiting frames.
lz4_flex = "0.14.2"
# `experimental`: zstd's own size estimates and parameter objects (exp-z, equation 4).
zstd = { version = "0.14.4", features = ["zstdmt", "experimental"] }
# Package 0b follow-up (owner, 2026-11-22: "comprehensive testing of all possibilities").
lz4 = "1.28.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
miniz_oxide = "0.9.1"
png = "0.18.1"
qoi = "0.4.1"
snap = "1.1.2"
# exp-d: the copied product encoder and decoder log through `tracing`.
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
# The product's clip modules (exp-av1, exp-av1-fetch) are included by #[path]; these are
# their dependencies, at the product's versions.
sha2 = "0.11"
libaom-sys = { version = "0.18.1", default-features = false, features = ["av1_encoder"] }
rav1d = "1.1.0"
libc = "0.2"
image-webp = "0.2.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dependencies.windows]
version = "=0.62.2"
features = [
    # exp-d: R by Windows.Media.Ocr on decoded and source frames.
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    # The product's clip folder check compares file names as Windows does.
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # exp-d: the copied clip decoder seeks with a PROPVARIANT.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
debug = false
